name: PR etiketleri

# Etiketleri taban daldaki .github/labeler.yml'ye göre basar; PR kodunu çalıştırmaz.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  etiketle:
    name: Etiketle
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
