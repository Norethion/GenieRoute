services:
  postgres:
    image: postgres:16
    container_name: genieroute-db
    environment:
      POSTGRES_DB: genieroute
      POSTGRES_USER: genieroute
      POSTGRES_PASSWORD: genieroute123
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
