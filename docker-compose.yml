services:
  postgres:
    image: postgres:18
    container_name: genieroute-db
    environment:
      POSTGRES_DB: genieroute
      POSTGRES_USER: genieroute
      POSTGRES_PASSWORD: genieroute123
    ports:
      - "5435:5432"
    volumes:
      - pgdata18:/var/lib/postgresql
    restart: unless-stopped

volumes:
  pgdata:
  pgdata18:
